# Base profile: secure by default. Every credential comes from the environment.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: unicornt-store-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  # Schema management. The versioned scripts live in classpath:db/migration.
  # Spring Boot 4.0 moved Flyway autoconfiguration to org.springframework.boot:spring-boot-flyway,
  # which is not on the classpath yet, so the same scripts are applied by Spring's SQL
  # initializer. Once that dependency lands, set FLYWAY_ENABLED=true and SQL_INIT_MODE=never.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/migration/V1__init.sql
      data-locations: classpath:db/migration/V2__seed_reference_data.sql
      continue-on-error: false
  web:
    resources:
      add-mappings: false

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

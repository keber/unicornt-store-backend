# Freezing store for the architecture backlog (PLAN.md section 3.2).
# The first run records every current violation into the store below and the build
# stays green. A *new* violation then fails the build. As slices remove violations
# the orchestrator regenerates the store (single writer).
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false

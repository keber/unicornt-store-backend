# Test configuration: never reach for a real database.
# Integration tests that need genuine PostgreSQL behaviour use Testcontainers and
# override these values with @DynamicPropertySource.

# In-memory H2 in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA owns the schema here; recreate it on every test run.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# The migration scripts target PostgreSQL 16, so they are not replayed against H2.
spring.flyway.enabled=false
spring.sql.init.mode=never

# Non-secret placeholders so the context can start without a populated environment.
app.jwt.secret=dGVzdC1vbmx5LW5vdC1hLXJlYWwtc2lnbmluZy1rZXktMzJi
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173

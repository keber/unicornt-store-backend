# dev environment — installed on the server as /opt/unicornt/dev/compose.yml
#            (the server uses the shorter compose.yml name; content must match)
# App on 127.0.0.1:8081 (nginx proxies api-unicornt-dev.keber.dev to it).
# Own Postgres container with an isolated named volume.
name: unicornt-dev

services:
  app:
    image: ${DOCKERHUB_USERNAME}/unicornt-store:${IMAGE_TAG}
    container_name: unicornt-dev-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Behind EasyEngine's front proxy; without this Spring builds http:// URLs.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - dev-site-network

  db:
    image: postgres:16-alpine
    container_name: unicornt-dev-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_dev:

# nginx reaches the app by CONTAINER NAME over the site network, not via the
# published 127.0.0.1:8081 port — inside the nginx container that address is the
# container itself. The published port stays for local curl/debugging.
networks:
  dev-site-network:
    external: true
    name: api-unicornt-dev.keber.dev

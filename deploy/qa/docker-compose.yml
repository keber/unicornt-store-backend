# qa environment — installed on the server as /opt/unicornt/qa/compose.yml
#            (the server uses the shorter compose.yml name; content must match)
# App on 127.0.0.1:8082 (nginx proxies api-unicornt-qa.keber.cl to it).
# Own Postgres container with an isolated named volume.
name: unicornt-qa

services:
  app:
    image: ${DOCKERHUB_USERNAME}/unicornt-store:${IMAGE_TAG}
    container_name: unicornt-qa-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: qa
      # Behind EasyEngine's front proxy; without this Spring builds http:// URLs.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - qa-site-network

  db:
    image: postgres:16-alpine
    container_name: unicornt-qa-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_qa:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_qa:

# nginx reaches the app by CONTAINER NAME over the site network, not via the
# published 127.0.0.1:8082 port — inside the nginx container that address is the
# container itself. The published port stays for local curl/debugging.
networks:
  qa-site-network:
    external: true
    name: api-unicornt-qa.keber.cl

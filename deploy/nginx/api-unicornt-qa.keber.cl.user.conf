# EasyEngine site: api-unicornt-qa.keber.cl
# Install to /opt/easyengine/sites/api-unicornt-qa.keber.cl/config/nginx/custom/user.conf
# then: ee site reload api-unicornt-qa.keber.cl
#
# Two things here are load-bearing, both learned the hard way (LESSONS #17):
#
#  1. proxy_pass targets the app's CONTAINER NAME on the site's Docker network,
#     not 127.0.0.1:<published port>. Inside this nginx container, 127.0.0.1 is
#     the container itself. The app joins that network in
#     deploy/qa/docker-compose.yml.
#
#  2. `set` + `resolver` makes nginx resolve the name per REQUEST. With a
#     literal hostname, nginx resolves at config load, so a redeploy that
#     briefly removes the container makes `nginx -t` fail and wedges the whole
#     site — it then serves its default webroot and answers 404, not 502.
location / {
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $unicornt_backend http://unicornt-qa-app:8080;
    proxy_pass $unicornt_backend;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $http_x_forwarded_proto, NOT $scheme: behind EasyEngine's front proxy
    # $scheme is the inner hop's, so Spring would build http:// URLs.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# --- Swagger UI assets ------------------------------------------------------
# EasyEngine's generated conf.d/main.conf defines regex locations for
# `\.(css|js)$` and for fonts/images (woff, woff2, png, ico, svg). In nginx a
# matching REGEX location beats a PREFIX location, so `location /` above never
# sees those requests -- they are served from this site's webroot, which is
# empty on an API host, and come back as nginx's own 404.
#
# The symptom is deceptive: /swagger-ui/index.html has no matching extension so
# it proxies fine and returns 200, while every asset it references 404s. The
# page loads and cannot paint. It cannot reproduce locally, because there is no
# proxy in front of Tomcat there.
#
# `^~` tells nginx that if this prefix matches it must NOT evaluate the regex
# locations, so the whole /swagger-ui/ tree reaches the app. Editing
# EasyEngine's main.conf directly would work too, but it is generated and gets
# overwritten by `ee site` operations -- this file is the supported override.
location ^~ /swagger-ui/ {
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $swagger_backend http://unicornt-qa-app:8080;
    proxy_pass $swagger_backend;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
}

# prod environment — installed on the server as /opt/unicornt/prod/compose.yml
#            (the server uses the shorter compose.yml name; content must match)
# App on 127.0.0.1:8088 (nginx proxies api-unicornt-store.keber.cl to it).
# No db service: prod uses Supabase. SPRING_DATASOURCE_* come from .env.
name: unicornt-prod

services:
  app:
    image: ${DOCKERHUB_USERNAME}/unicornt-store:${IMAGE_TAG}
    container_name: unicornt-prod-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Behind EasyEngine's front proxy; without this Spring builds http:// URLs.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "127.0.0.1:8088:8080"
    restart: unless-stopped
    networks:
      - default
      - prod-site-network

# nginx reaches the app by CONTAINER NAME over the site network, not via the
# published 127.0.0.1:8088 port — inside the nginx container that address is the
# container itself. The published port stays for local curl/debugging.
networks:
  prod-site-network:
    external: true
    name: api-unicornt-store.keber.cl

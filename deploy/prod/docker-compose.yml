# prod environment — /srv/unicornt/prod/docker-compose.yml
# App on 127.0.0.1:8088 (nginx proxies api-unicornt-store.keber.cl to it).
# No db service: prod uses Supabase. SPRING_DATASOURCE_* come from .env.
name: unicornt-prod

services:
  app:
    image: ${DOCKERHUB_USERNAME}/unicornt-store:${IMAGE_TAG}
    container_name: unicornt-prod-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:8088:8080"
    restart: unless-stopped
